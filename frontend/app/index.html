<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaManager — Bibliothèque</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══ NAVBAR ══════════════════════════════════════════════════════════════ -->
<nav class="navbar">
  <div class="nav-left">
    <div class="nav-brand">
      <i class="bi bi-collection-play"></i>
      <span>MediaManager</span>
    </div>
    <div class="nav-links">
      <button class="nav-item active" data-tab="library" onclick="switchTab('library')">
        <i class="bi bi-grid"></i> Bibliothèque
      </button>
      <button class="nav-item" data-tab="rename" onclick="switchTab('rename')">
        <i class="bi bi-pencil-square"></i> Renommage
        <span id="rename-badge" class="badge-count" style="display:none">0</span>
      </button>
    </div>
  </div>
  <div class="nav-right">
  <span id="service-status" title="État du service" style="font-size:10px;display:flex;align-items:center;gap:4px;color:var(--muted)">
    <span id="service-dot" style="width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block"></span>
    <span id="service-label">…</span>
  </span>
  <a href="/admin" class="nav-item nav-right-item" title="Interface admin">
    <i class="bi bi-gear"></i>
  </a>
</div>
</nav>

<!-- ══ PANELS ══════════════════════════════════════════════════════════════ -->
<main class="main-content">

  <!-- Panel : Bibliothèque -->
  <div id="panel-library" class="tab-panel active">
    <div id="library-content">
      <!-- Rempli par library.js -->
    </div>
  </div>

  <!-- Panel : Renommage -->
  <div id="panel-rename" class="tab-panel">
    <div id="rename-content">
      <!-- Rempli par rename.js -->
    </div>
  </div>

</main>

<script>
const API = '';
let activeTab = 'library';

function switchTab(name) {
  if (name === activeTab) return;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name)?.classList.add('active');
  document.querySelector(`.nav-item[data-tab="${name}"]`)?.classList.add('active');
  activeTab = name;
  if (name === 'library') Library.init();
  if (name === 'rename')  Rename.init();
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function checkService() {
  const dot   = document.getElementById('service-dot');
  const label = document.getElementById('service-label');
  try {
    const r = await fetch(`${API}/api/admin/dashboard`);
    if (r.ok) {
      dot.style.background   = 'var(--green)';
      label.textContent      = 'OK';
      label.style.color      = 'var(--green)';
    } else {
      throw new Error();
    }
  } catch {
    dot.style.background = 'var(--red)';
    label.textContent    = 'hors ligne';
    label.style.color    = 'var(--red)';
  }
}

// Vérifier au démarrage puis toutes les 30s
checkService();
setInterval(checkService, 30000);


</script>
<script src="library.js"></script>
<script src="rename.js"></script>
<script>
window.addEventListener('load', () => {
  Library.init();
  Rename.loadBadge();
});
</script>
</body>
</html>
