<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaManager — Bibliothèque</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══ NAVBAR ══════════════════════════════════════════════════════════════ -->
<nav class="navbar">
  <div class="nav-left">
    <div class="nav-brand">
      <i class="bi bi-collection-play"></i>
      <span>MediaManager</span>
    </div>
    <div class="nav-links">
      <button class="nav-item active" data-tab="library" onclick="goLibraryHome()">
        <i class="bi bi-grid"></i> Bibliothèque
      </button>
      <button class="nav-item" data-tab="rename" onclick="goRename()">
        <i class="bi bi-pencil-square"></i> Renommage
        <span id="rename-badge" class="badge-count hidden">0</span>
      </button>
    </div>
  </div>
  <div class="nav-right">
    <span id="service-status" class="service-status" title="État du service">
      <span id="service-dot" class="service-dot"></span>
      <span id="service-label">…</span>
    </span>
    <div class="theme-selector">
      <button class="theme-btn" id="theme-btn-light" onclick="setTheme('light')" title="Thème clair">
        <i class="bi bi-sun"></i>
      </button>
      <button class="theme-btn active" id="theme-btn-dark" onclick="setTheme('dark')" title="Thème sombre">
        <i class="bi bi-moon-stars"></i>
      </button>
      <button class="theme-btn" id="theme-btn-auto" onclick="setTheme('auto')" title="Thème auto">
        <i class="bi bi-circle-half"></i>
      </button>
    </div>
    <a href="/admin" class="nav-item nav-right-item" title="Interface admin">
      <i class="bi bi-gear"></i>
    </a>
  </div>
</nav>

<!-- ══ PANELS ══════════════════════════════════════════════════════════════ -->
<main class="main-content">

  <!-- Panel : Bibliothèque -->
  <div id="panel-library" class="tab-panel active">
    <div id="library-content">
      <!-- Rempli par library.js -->
    </div>
  </div>

  <!-- Panel : Renommage -->
  <div id="panel-rename" class="tab-panel">
    <div id="rename-content">
      <!-- Rempli par rename.js -->
    </div>
  </div>

</main>

<script>
/* ── Thème ────────────────────────────────────────────────────────────────── */
function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('mm-theme', theme);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`theme-btn-${theme}`)?.classList.add('active');
}

/* ── App ──────────────────────────────────────────────────────────────────── */
const API = '';
let activeTab = 'library';

function switchTab(name) {
  if (name === activeTab) return;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item[data-tab]').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name)?.classList.add('active');
  document.querySelector(`.nav-item[data-tab="${name}"]`)?.classList.add('active');
  activeTab = name;
  if (name === 'library') Library.init();
  if (name === 'rename')  Rename.init();
}


function goLibraryHome() {
  if (activeTab !== 'library') {
    switchTab('library');
  } else {
    Library.init();
  }
}

function goRename() {
  if (activeTab !== 'rename') {
    switchTab('rename');
  } else {
    Rename.init();
  }
}



function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function checkService() {
  const dot   = document.getElementById('service-dot');
  const label = document.getElementById('service-label');
  try {
    const r = await fetch(`${API}/api/admin/dashboard`);
    if (r.ok) {
      dot.className   = 'service-dot ok';
      label.className = 'service-label ok';
      label.textContent = 'OK';
    } else {
      throw new Error();
    }
  } catch {
    dot.className   = 'service-dot err';
    label.className = 'service-label err';
    label.textContent = 'hors ligne';
  }
}

// Vérifier au démarrage puis toutes les 30s
checkService();
setInterval(checkService, 30000);


</script>
<script src="library.js"></script>
<script src="rename.js"></script>
<script>
window.addEventListener('load', () => {
  setTheme(localStorage.getItem('mm-theme') || 'dark');
  Library.init();
  Rename.loadBadge();
});
</script>
</body>
</html>
