<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — MediaManager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #c9d1d9;
      --muted:   #8b949e;
      --white:   #e6edf3;
      --blue:    #388bfd;
      --blue-dk: #1f4b8e;
      --green:   #2ea043;
      --red:     #da3633;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon { font-size: 2.2rem; }
    .logo-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--white);
      margin-top: 8px;
    }
    .logo-sub { font-size: .82rem; color: var(--muted); margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: .84rem; color: var(--muted); margin-bottom: 6px; }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--white);
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--blue); }

    .btn {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: .92rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      font-family: inherit;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn:disabled { opacity: .5; cursor: default; }

    .alert {
      border-radius: 6px;
      padding: 10px 14px;
      font-size: .84rem;
      margin-bottom: 16px;
      display: none;
    }
    .alert.error   { background: rgba(218,54,51,.15); color: #f78166; border: 1px solid rgba(218,54,51,.3); display: block; }
    .alert.success { background: rgba(46,160,67,.15); color: #56d364; border: 1px solid rgba(46,160,67,.3); display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">📺</div>
      <div class="logo-title">MediaManager</div>
      <div class="logo-sub">Connexion requise</div>
    </div>

    <div class="alert" id="msg"></div>

    <form id="form" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input id="username" type="text" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="btn">Se connecter</button>
    </form>
  </div>

  <script>
    const API = `${location.protocol}//${location.hostname}:8000`;

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      msg.className = 'alert';
      btn.disabled = true;
      btn.textContent = 'Connexion…';

      try {
        const r = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
          credentials: 'include',
        });
        const d = await r.json();
        if (!r.ok) {
          msg.textContent = d.detail || 'Erreur de connexion';
          msg.className = 'alert error';
        } else {
          msg.textContent = 'Connexion réussie…';
          msg.className = 'alert success';
          location.href = d.role === 'admin' ? '/admin/' : '/app/';
        }
      } catch {
        msg.textContent = 'Impossible de joindre le serveur';
        msg.className = 'alert error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    }
  </script>
</body>
</html>
